name: Documentation

on:
  push:
    branches: [main]
    paths:
      [
        "docs/**",
        "README.md",
        "SECURITY.md",
        "CHANGELOG.md",
        "zensical.toml",
        "requirements-docs.*",
        "scripts/prepare_docs.py",
        "scripts/build_docs.py",
        "scripts/site_config.py",
        "docs-theme/**",
        "website/analytics.json",
        "website/assets/**",
        "console/web/assets/fonts/**",
        "LICENSE-APACHE",
        "NOTICE",
        ".github/workflows/pages.yml",
      ]
  pull_request:
    paths:
      [
        "docs/**",
        "README.md",
        "SECURITY.md",
        "CHANGELOG.md",
        "zensical.toml",
        "requirements-docs.*",
        "scripts/prepare_docs.py",
        "scripts/build_docs.py",
        "scripts/site_config.py",
        "docs-theme/**",
        "website/analytics.json",
        "website/assets/**",
        "console/web/assets/fonts/**",
        "LICENSE-APACHE",
        "NOTICE",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build the guides with strict link validation
        run: |
          python -m pip install --require-hashes -r requirements-docs.txt
          if [ "${{ github.event_name }}" = pull_request ]; then
            python scripts/build_docs.py --preview
          else
            python scripts/build_docs.py
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
