[package]
name = "vacancyd"
version = "1.0.0"
edition = "2021"
description = "Gate borrowed AI requests on owner policy and available resources."
license = "Apache-2.0"
repository = "https://github.com/maxfield-allison/vacancyd"
keywords = ["gpu", "ollama", "proxy", "homelab", "inference"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.89"
default-run = "vacancyd"

[workspace]
members = ["console"]
default-members = ["."]
resolver = "2"

[features]
windows-session = []

[[bin]]
name = "vacancyd-session"
path = "src/bin/vacancyd-session.rs"
required-features = ["windows-session"]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
getrandom = "0.2"
http = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
prometheus = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.20"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"

[build-dependencies]
tauri-winres = "=0.3.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux presence: systemd-logind session state over the system D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.59", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_RemoteDesktop",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Recovery",
    "Win32_System_Services",
    "Win32_System_EventLog",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
] }

[profile.release]
strip = true
lto = "thin"

# Exact upstream dependency update; see docs/dependency-policy.md.
[patch.crates-io]
tauri-utils = { path = "vendor/tauri-utils" }
