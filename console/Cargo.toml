[package]
name = "vacancyd-console"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Local owner console for vacancyd"
repository = "https://github.com/maxfield-allison/vacancyd"
build = "build.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
vacancyd = { path = ".." }
tauri = { version = "=2.11.5", default-features = false, features = ["wry", "compression", "tray-icon"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[target.'cfg(windows)'.dependencies.tokio]
version = "1"
features = ["time"]
